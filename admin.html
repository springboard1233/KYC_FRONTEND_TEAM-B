<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Dashboard • KYC Suite</title>
  <link href="styles.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .dashboard { display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem; }
    .card { background: #fff; border-radius: 12px; padding: 1rem; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .table th, .table td { padding: 0.6rem; border-bottom: 1px solid #ddd; text-align:left; }
    .actions button { margin: 0 4px; }
    .view-btn { cursor:pointer; color:#007bff; font-size:1.2rem; }
    .modal { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.6); align-items:center; justify-content:center; }
    .modal-content { background:#fff; padding:1.5rem; border-radius:10px; max-width:500px; width:100%; }
    .status-approved { color:green; font-weight:bold; }
    .status-rejected { color:red; font-weight:bold; }
    .status-review { color:orange; font-weight:bold; }
  </style>
</head>
<body class="bg-page">
  <header class="site-header">
    <div class="container header-row">
      <h1 class="brand small">KYC Suite - Admin</h1>
      <nav>
        <a href="upload.html">Upload</a>
        <a href="verification.html">Verification</a>
        <a href="compliance.html">Compliance</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h2>Admin Dashboard</h2>
    <div class="dashboard">
      
      <!-- Left side: Audit Trail Table -->
      <div class="card">
        <h3>Audit Trail</h3>
        <table class="table" id="adminAuditTable">
          <thead>
            <tr>
              <th>Time</th>
              <th>Document Name</th>
              <th>Decision</th>
              <th>Score</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <!-- Right side: Charts -->
      <div class="card">
        <h3>Status Overview</h3>
        <canvas id="barChart" height="200"></canvas>
        <canvas id="pieChart" height="200" style="margin-top:1rem;"></canvas>
      </div>
    </div>
  </main>

  <!-- Modal -->
  <div class="modal" id="detailModal">
    <div class="modal-content">
      <h3>Document Details</h3>
      <div id="modalDetails"></div>
      <div class="actions" style="margin-top:1rem;">
        <button id="approveBtn" class="btn primary">Approve</button>
        <button id="rejectBtn" class="btn">Reject</button>
        <button id="reviewBtn" class="btn">Review</button>
      </div>
      <div style="text-align:right; margin-top:1rem;">
        <button onclick="closeModal()" class="btn">Close</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'auditTrail'; // only one source of truth

    const auditTableBody = document.querySelector('#adminAuditTable tbody');
    const modal = document.getElementById('detailModal');
    const modalDetails = document.getElementById('modalDetails');
    let currentDocId = null;

   function getAudit() {
  return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
}function saveAudit(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}
function renderTable() {
  const audit = getAudit();
  auditTableBody.innerHTML = '';
  audit.forEach(r => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${new Date(r.time).toLocaleString()}</td>
      <td>${r.title || "Aadhaar"}</td>
      <td class="status-${r.decision.toLowerCase()}">${r.decision}</td>
      <td>${r.score}%</td>
      <td>
        <span class="view-btn" onclick="viewDetails('${r.docId}')">👁</span>
        <span class="delete-btn" onclick="deleteAudit('${r.docId}')" style="color:red;cursor:pointer;">🗑</span>
      </td>
    `;
    auditTableBody.appendChild(tr);
  });
  updateCharts();
}
function deleteAudit(docId) {
  if (!confirm("Are you sure you want to delete this document?")) return;

  let audits = getAudit();              // instead of auditLogs
  audits = audits.filter(entry => entry.docId !== docId);
  saveAudit(audits);                    // save back
  renderTable();                        // refresh table in admin
}



function viewDetails(docId) {
  const audit = getAudit();
  const entry = audit.find(r => r.docId === docId);
  if (!entry) return;
  currentDocId = docId;
  modalDetails.innerHTML = `
    <p><strong>Document Name:</strong> ${entry.title || 'Aadhaar'}</p>
    <p><strong>Time:</strong> ${new Date(entry.time).toLocaleString()}</p>
    <p><strong>Decision:</strong> ${entry.decision}</p>
    <p><strong>Score:</strong> ${entry.score}%</p>
    <p><strong>Notes:</strong> ${entry.notes || '—'}</p>
    <hr/>
    <p><strong>Name:</strong> ${entry.name || 'Vedhika Bhatnagar'}</p>
    <p><strong>Aadhaar:</strong> ${entry.aadhaar || '3767 0517 8982'}</p>
    <p><strong>Address:</strong> ${entry.address || 'H.No. 46, Rhagavan Zila, Adoni'}</p>
  `;
  modal.style.display = 'flex';
}

function closeModal() {
  modal.style.display = 'none';
  currentDocId = null;
}


    document.getElementById('approveBtn').addEventListener('click', () => updateStatus('Approved'));
    document.getElementById('rejectBtn').addEventListener('click', () => updateStatus('Rejected'));
    document.getElementById('reviewBtn').addEventListener('click', () => updateStatus('Review'));

    function updateStatus(status) {
      const audit = getAudit();
      const entry = audit.find(r => r.docId === currentDocId);
      if (entry) {
        entry.decision = status;
        saveAudit(audit);
        renderTable();
        closeModal();
      }
    }
function addAuditEntry(entry){
  const existing = JSON.parse(localStorage.getItem('auditTrail') || '[]');
  const e = { 
    time: new Date().toISOString(), 
    docId: entry.docId || genId(), 
    decision: entry.decision || 'Unknown', 
    score: entry.score || 0, 
    notes: entry.notes || '', 
    type: entry.type || '',       // <-- save document type
    data: entry.data || {}        // <-- save actual data (name, etc.)
  };
  existing.unshift(e);
  localStorage.setItem('auditTrail', JSON.stringify(existing));
}

    // Charts
    let barChart, pieChart;
    function updateCharts() {
      const audit = getAudit();
      const counts = { Approved:0, Rejected:0, Review:0 };
      audit.forEach(r => {
        if (counts[r.decision] !== undefined) counts[r.decision]++;
      });

      const data = [counts.Approved, counts.Rejected, counts.Review];

      if (barChart) barChart.destroy();
      if (pieChart) pieChart.destroy();

      barChart = new Chart(document.getElementById('barChart'), {
        type:'bar',
        data:{ labels:['Approved','Rejected','Review'], datasets:[{
          data:data,
          backgroundColor:['green','red','orange']
        }] },
        options:{ responsive:true, plugins:{ legend:{ display:false } } }
      });

      pieChart = new Chart(document.getElementById('pieChart'), {
        type:'pie',
        data:{ labels:['Approved','Rejected','Review'], datasets:[{
          data:data,
          backgroundColor:['green','red','orange']
        }] },
        options:{ responsive:true }
      });
    }

    renderTable();
  </script>
</body>
</html>

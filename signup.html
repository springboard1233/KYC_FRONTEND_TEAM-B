<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sign Up</title>
<link rel="stylesheet" href="auth.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/css/intlTelInput.css"/>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <h2>Create Account</h2>
    <form id="signupForm">
      <div class="grid-2">
        <div>
          <label>First Name</label>
          <input type="text" id="firstName" placeholder="First Name" required />
        </div>
        <div>
          <label>Last Name</label>
          <input type="text" id="lastName" placeholder="Last Name" required />
        </div>
      </div>

      <label>Phone Number</label>
      <input type="tel" id="phone" placeholder="Phone Number" required />

      <label>Email</label>
      <input type="email" id="signupEmail" placeholder="Email" required />

      <label>Password</label>
      <div class="password-row">
        <input type="password" id="signupPassword" placeholder="Password" required />
        <button type="button" class="ghost" onclick="togglePassword('signupPassword')">Show</button>
      </div>

      <label>Confirm Password</label>
      <div class="password-row">
        <input type="password" id="confirmPassword" placeholder="Confirm Password" required />
        <button type="button" class="ghost" onclick="togglePassword('confirmPassword')">Show</button>
      </div>

      <button class="primary" type="submit">Sign Up</button>
      <p class="muted">Already have an account? <a href="login.html">Login</a></p>
    </form>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/intlTelInput.min.js"></script>
<script src="auth.js"></script>
<script>
  const phoneInput = document.getElementById("phone");
  window.intlTelInput(phoneInput, {
    initialCountry: "in",
    preferredCountries: ["in","us","gb","ca","au"],
    utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/utils.js"
  });
</script>
</body>
</html>

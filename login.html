<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login</title>
<link rel="stylesheet" href="auth.css"/>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <h2>Welcome Back</h2>
    <form id="loginForm">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="Email" required />

      <label>Password</label>
      <div class="password-row">
        <input type="password" id="loginPassword" placeholder="Password" required />
        <button type="button" class="ghost" onclick="togglePassword('loginPassword')">Show</button>
      </div>

      <button class="primary" type="submit">Login</button>
      <p class="muted">No account? <a href="signup.html">Sign Up</a></p>
      <p id="errorMsg" class="muted" style="color:red; text-align:center; margin-top:10px;"></p>
    </form>
  </div>
</div>
<script>
  // Show/Hide password
  function togglePassword(id) {
    const input = document.getElementById(id);
    input.type = input.type === "password" ? "text" : "password";
  }

  document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value.trim();
    const errorMsg = document.getElementById("errorMsg");

    // 🔹 Hardcoded admin credentials
    const adminEmail = "admin@system.com";
    const adminPass = "admin123";

    if (email === adminEmail && password === adminPass) {
      localStorage.setItem("isAdmin", "true");
      window.location.href = "admin.html"; // Redirect admin
      return;
    }

    // 🔹 Check normal users stored in localStorage
    const users = JSON.parse(localStorage.getItem("users")) || [];
    const matchedUser = users.find(u => u.email === email && u.password === password);

    if (matchedUser) {
      localStorage.setItem("isAdmin", "false");
      localStorage.setItem("currentUser", email);
      window.location.href = "index.html"; // Redirect user
    } else {
      errorMsg.textContent = "Invalid email or password!";
    }
  });
</script>
</body>
</html>

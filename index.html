<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAN Card Sample</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="pan-card">
    <div class="pan-header">
      <span class="left">INCOME TAX DEPARTMENT</span>
      <img src="emblem.jpg" alt="Emblem" class="emblem">
      <span class="right">GOVT. OF INDIA</span>
    </div>

    <div class="pan-body">
      <div class="profile">
        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Profile">
        <p class="name">CARL JAMES</p>
      </div>

      <div class="card-info">
        <h3>PERMANENT ACCOUNT NUMBER CARD</h3>
        <p class="pan-no">ABCDE1234F</p>
      </div>

      <div class="qr-code">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=80x80&data=ABCDE1234F" alt="QR Code">
      </div>
    </div>

    <div class="pan-footer">
      <span class="dob">DOB: 01/01/1999</span>
      <span class="signature">Signature</span>
    </div>
  </div>
</body>
</html>
